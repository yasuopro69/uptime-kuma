# fly.toml app configuration file generated for uptime-kuma--olpg on 2026-10-31T15:04:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'uptime-kuma--olpg'
primary_region = 'sin'
kill_signal = 'SIGINT'
kill_timeout = '10s'
swap_size_mb = 256

[build]

[[mounts]]
  source = 'app_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 150
    soft_limit = 100

[checks]
  [checks.health]
    port = 3001
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'get'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
